/* ---------- Multi-step form ---------- */
const SAUDI_CITIES = ['الرياض','جدة','مكة المكرمة','المدينة المنورة','الدمام','الخبر','الطائف','تبوك','أبها','حائل','بريدة','نجران','جازان'];
const FINANCE_TYPES = ['تمويل عقاري شخصي','تمويل سكني مدعوم','إعادة تمويل عقاري','رهن عقاري','شراء أرض'];

function FormPanel({ onSubmitted }) {
  const [step, setStep] = useState(1);
  const total = 5;
  const [data, setData] = useState({
    firstName:'', lastName:'',
    phone:'', city:'',
    finance:'',
    obligation:'', salary:'',
    consent: true,
  });
  const [errors, setErrors] = useState({});
  const [warnOpen, setWarnOpen] = useState(false);

  const progress = (step / total) * 100;

  function set(k, v) { setData(d => ({...d, [k]: v})); }

  function validate() {
    const e = {};
    if (step === 1) {
      if (!data.firstName.trim()) e.firstName = 'مطلوب';
      if (!data.lastName.trim()) e.lastName = 'مطلوب';
    } else if (step === 2) {
      if (!/^(05)\d{8}$/.test(data.phone.trim())) e.phone = 'رقم جوال غير صحيح (مثال: 05XXXXXXXX)';
      if (!data.city) e.city = 'اختر المدينة';
    } else if (step === 3) {
      if (!data.finance) e.finance = 'اختر نوع التمويل';
    } else if (step === 4) {
      if (!data.salary || Number(data.salary) < 1000) e.salary = 'أدخل دخلًا شهريًا صحيحًا';
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function next() {
    if (!validate()) return;
    if (step < total) setStep(step + 1);
  }
  function back() {
    setErrors({});
    if (step > 1) setStep(step - 1);
  }
  function submit() {
    if (!data.consent) {
      setErrors({ consent: 'يجب الموافقة قبل الإرسال' });
      return;
    }
    onSubmitted();
  }

  const titles = {
    1: 'بيانات الاسم',
    2: 'بيانات التواصل',
    3: 'نوع التمويل المطلوب',
    4: 'الالتزام والدخل',
    5: 'مراجعة وإرسال',
  };

  return (
    <div className="bg-white rounded-3xl p-5 md:p-7 shadow-softLg border-2 border-gold/60">
      {/* progress */}
      <div className="flex items-center justify-between mb-1 text-[12px] text-muted">
        <span>الخطوة {step} من {total}</span>
        <span>{Math.round(progress)}%</span>
      </div>
      <div className="w-full h-2 rounded-full bg-neutral-100 overflow-hidden">
        <div className="h-full bg-gradient-to-l from-gold to-honey rounded-full transition-all" style={{ width: `${progress}%` }} />
      </div>

      <h3 className="text-right text-[20px] md:text-[22px] font-extrabold text-ink mt-5">{titles[step]}</h3>

      <div className="mt-5 space-y-4 fadeIn" key={step}>
        {step === 1 && (
          <>
            <Field label="الاسم الأول" error={errors.firstName}>
              <input value={data.firstName} onChange={e=>set('firstName', e.target.value)} placeholder="مثال: محمد" className={inputCls(errors.firstName)} />
            </Field>
            <Field label="اسم العائلة" error={errors.lastName}>
              <input value={data.lastName} onChange={e=>set('lastName', e.target.value)} placeholder="مثال: العتيبي" className={inputCls(errors.lastName)} />
            </Field>
          </>
        )}

        {step === 2 && (
          <>
            <Field label="رقم الجوال" error={errors.phone}>
              <input dir="ltr" inputMode="numeric" value={data.phone} onChange={e=>set('phone', e.target.value.replace(/[^\d]/g,''))} placeholder="05XXXXXXXX" className={inputCls(errors.phone) + ' text-left'} maxLength={10}/>
            </Field>
            <Field label="المدينة" error={errors.city}>
              <select value={data.city} onChange={e=>set('city', e.target.value)} className={inputCls(errors.city)}>
                <option value="">اختر مدينتك</option>

}

/* ---------- Sticky mobile CTA ---------- */
function StickyMobileCTA({ onCTAClick, hidden }) {
  if (hidden) return null;
  return (
    <div className="md:hidden fixed inset-x-0 bottom-0 z-40 px-4 pb-3 pt-2 bg-gradient-to-t from-white via-white/95 to-white/0">
      <button
        onClick={onCTAClick}
        className="w-full bg-grass hover:bg-grassDark transition text-white font-extrabold rounded-2xl py-3.5 shadow-softLg"
      >
        سجل الآن وأبشر بالسعد
      </button>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [submitted, setSubmitted] = useState(false);
  const formRef = useRef(null);

  function scrollToForm() {
    if (!formRef.current) return;
    const top = formRef.current.getBoundingClientRect().top + window.scrollY - 16;
    window.scrollTo({ top, behavior: 'smooth' });
  }

  return (
    <div className="min-h-screen pb-24 md:pb-0">
      <Header />
      <Hero onCTAClick={scrollToForm} />
      <IntroAccordion />
      <Steps onCTAClick={scrollToForm} />
      <FormSection formRef={formRef} onSubmitted={()=>setSubmitted(true)} submitted={submitted} />
      <Commitment />
      <Testimonials />
      <FinalCTA onCTAClick={scrollToForm} />
      <TrustLogos />
      <Footer />
      <StickyMobileCTA onCTAClick={scrollToForm} hidden={submitted} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
